; Adafruit Feather RP2350 + Adafruit DVI (HSTX) -> HDMI
; Akwarium 320x240 (16-bit, podwójny bufor), wyjście 640x480@60

[env:feather_rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather_rp2350_hstx
framework = arduino
board_build.core = earlephilhower
; HSTX/DVI potrzebuje stałego zegara systemowego 150 MHz (domyślny dla RP2350)
board_build.f_cpu = 150000000L
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit DVI HSTX
monitor_speed = 115200
upload_protocol = picotool
